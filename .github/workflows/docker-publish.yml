name: Docker Publish

# Builds and pushes the canonical image tag matrix to GHCR. The matrix is
# generated from the install spec (`cargo generate installers`) into
# dev/ci/docker-tags.toml; this workflow consumes it so published tags can never
# drift from the spec. Each entry produces an immutable version-pinned tag
# (Alpine-style `<stem>-v<version>`) and a floating tag (`<stem>`).
#
# Images are pushed with the canonical platform matrix first, signed by digest,
# then the pinned tag is scanned in report-only mode (exit-code: 0). Enforcement
# flips in a follow-up after the baseline is triaged.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_ref:
        description: "Immutable release tag to build (vX.Y.Z)"
        required: true
        type: string
      publish_prebuilt:
        description: "Also publish prebuilt latest/versioned/Debian images from release assets"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing immutable release tag to publish (vX.Y.Z)"
        required: true
        type: string
      publish_prebuilt:
        description: "Also publish prebuilt latest/versioned/Debian images from release assets"
        required: false
        default: false
        type: boolean

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC, package write, and security-events permissions are granted only to
  # the jobs that need them.

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    name: Resolve tag matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
      image: ${{ steps.resolve.outputs.image }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          fetch-depth: 0
      - name: Resolve immutable release identity
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.release_ref || github.ref_name }}
        run: |
          set -euo pipefail
          release_ref="$REQUESTED_REF"
          if [[ ! "$release_ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be an immutable stable tag (vX.Y.Z): ${release_ref}"
            exit 1
          fi

          git rev-parse "${release_ref}^{commit}" >/dev/null
          version="${release_ref#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          matrix_version="$(yq -r '.version' dev/ci/docker-tags.toml)"
          if [[ "$cargo_version" != "$version" || "$matrix_version" != "$version" ]]; then
            echo "::error::Release identity mismatch: tag=${version}, Cargo.toml=${cargo_version}, docker-tags.toml=${matrix_version}"
            exit 1
          fi

          image="${GITHUB_REPOSITORY,,}"
          if [[ ! "$image" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "::error::Invalid normalized GHCR image name: ${image}"
            exit 1
          fi

          {
            echo "release_ref=${release_ref}"
            echo "version=${version}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"
      - name: Read generated docker-tags.toml into a build matrix
        id: read
        run: |
          # Convert the canonical TOML matrix to the JSON the Actions matrix
          # consumes. yq ships on ubuntu-latest runners.
          include="$(yq -o=json -I=0 '.tags' dev/ci/docker-tags.toml)"
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & push ${{ matrix.stem }}
    if: github.repository == 'IvanLi-CN/zeroclaw'
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write   # required for keyless cosign OIDC signing of container images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push pinned + floating tags
        id: build-push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Platforms are resolved per tag from the generated matrix: Dockerfile
          # tags build amd64+arm64 (the Dockerfile cross-compiles to arm64 on the
          # native amd64 builder), Containerfile tags stay amd64-only.
          platforms: ${{ matrix.platforms }}
          build-args: |
            ZEROCLAW_CARGO_FLAGS=${{ matrix.flags }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:${{ matrix.pinned_tag }}
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:${{ matrix.floating_tag }}

      - name: Sign container image (keyless / Rekor)
        # Signs by digest so the signature is immutable regardless of tag mutations.
        # Consumers verify with:
        #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp "^https://github.com/IvanLi-CN/zeroclaw/" \
        #     ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}@${{ steps.build-push.outputs.digest }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}@${DIGEST}"

  prebuilt:
    name: Publish prebuilt release images
    if: inputs.publish_prebuilt == true
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.matrix.outputs.release_ref }}

      - name: Download and verify release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.matrix.outputs.release_ref }}
        run: |
          set -euo pipefail
          release_ref="$RELEASE_REF"
          mkdir -p release-download artifacts
          cd release-download
          gh release download "$release_ref" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --pattern zeroclaw-x86_64-unknown-linux-gnu.tar.gz \
            --pattern zeroclaw-aarch64-unknown-linux-gnu.tar.gz
          sha256sum --check --ignore-missing SHA256SUMS
          cp zeroclaw-*-unknown-linux-gnu.tar.gz ../artifacts/
          cd ..
          bash scripts/ci/prepare_docker_context.sh from-artifacts docker-ctx artifacts

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Build and push prebuilt image
        id: prebuilt
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: docker-ctx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:${{ needs.matrix.outputs.release_ref }}
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Sign prebuilt image
        env:
          DIGEST: ${{ steps.prebuilt.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}@${DIGEST}"

      - name: Build and push Debian compatibility image
        id: prebuilt-debian
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          build-args: VARIANT=debian
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:${{ needs.matrix.outputs.release_ref }}-debian
            ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:debian
          platforms: linux/amd64,linux/arm64

      - name: Sign Debian compatibility image
        env:
          DIGEST: ${{ steps.prebuilt-debian.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}@${DIGEST}"

  scan:
    name: Scan ${{ matrix.stem }}
    if: github.repository == 'IvanLi-CN/zeroclaw'
    needs: [matrix, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan pinned tag with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-dirs: /usr/share/zoneinfo
          image-ref: ${{ env.REGISTRY }}/${{ needs.matrix.outputs.image }}:${{ matrix.pinned_tag }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ matrix.stem }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 14

  upload-sarif:
    name: Upload SARIF ${{ matrix.stem }}
    if: github.repository == 'IvanLi-CN/zeroclaw'
    needs: [matrix, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Download Trivy SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-results-${{ matrix.stem }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: trivy-results.sarif
